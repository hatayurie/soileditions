<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Soil Editions</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .bg {
    position: fixed;
    inset: 0;
    background-size: cover; 
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
  }

  .bg.active {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="bg" style="background-image: url('images/photo1.jpg');"></div>
<div class="bg" style="background-image: url('images/photo2.jpg');"></div>
<div class="bg" style="background-image: url('images/photo3.jpg');"></div>

<script>
  const slides = document.querySelectorAll('.bg');
  let current = Math.floor(Math.random() * slides.length);
  let prev = -1; 

  slides[current].classList.add('active');

  setInterval(() => {
    slides[current].classList.remove('active');
    setTimeout(() => {
      let next;
      do {
        next = Math.floor(Math.random() * slides.length);
      } while (next === current || next === prev);

      prev = current;
      current = next;
      slides[current].classList.add('active');
    }, 250);
  }, 3000); 
</script>

</body>
</html>
